{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": ["virbr66"]
    },
    "control-sockets": [
      {
        "socket-type": "http",
        "socket-address": "127.0.0.1",
        "socket-port": 8000,
        "authentication": {
          "type": "basic",
          "realm": "Kea PR 949 review",
          "clients": [
            { "user": "review", "password": "review" }
          ]
        }
      }
    ],
    "hooks-libraries": [
      { "library": "libdhcp_lease_cmds.so" },
      { "library": "libdhcp_host_cmds.so" },
      { "library": "libdhcp_pgsql.so" }
    ],
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv"
    },
    "hosts-databases": [
      {
        "type": "postgresql",
        "name": "kea",
        "user": "kea",
        "password": "kea-review-only",
        "host": "127.0.0.1",
        "port": 15432
      }
    ],
    "valid-lifetime": 3600,
    "subnet4": [
      {
        "id": 66,
        "subnet": "192.168.66.0/24",
        "pools": [
          { "pool": "192.168.66.100 - 192.168.66.200" }
        ],
        "option-data": [
          { "name": "routers", "data": "192.168.66.1" },
          { "name": "domain-name-servers", "data": "192.168.66.1" },
          { "name": "domain-name", "data": "local.lan" }
        ]
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          { "output": "stdout" }
        ],
        "severity": "INFO"
      }
    ]
  }
}
